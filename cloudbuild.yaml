
# DriveTracker - Google Cloud Build CI/CD Pipeline
#
# Triggered automatically on every push to the `main` branch via a Cloud Build
# GitHub trigger (configured in GCP Console or via gcloud CLI).
#
# Deployment strategy for critical files (index.html, app.js, app2.js, sw.js, config.js):
#   - Uploaded atomically with Cache-Control: no-cache so the CDN header is set at the
#     exact moment of upload (no race window where rsync writes without the header).
#   - app.js is deployed under BOTH app.js and app2.js. index.html references app2.js.
#     app.js is also kept current so users hitting a stale CDN-cached index.html (which
#     may still reference /app.js?v=N) always get the latest code.
#   - The SW (sw.js) must be no-cache so browsers detect new versions immediately.
#
# Pre-requisites:
#   - A GCS bucket named ${_BUCKET} configured for static website hosting.
#   - The Cloud Build service account has roles/storage.objectAdmin on the bucket.
#   - Substitution variables set in the trigger (see "Substitutions" below).
#
# Substitutions (set in Cloud Build trigger UI or --substitutions flag):
#   _BUCKET : Your GCS bucket name, e.g. drive-tracker-497900
#   _REGION : GCS bucket region, e.g. us-central1 (informational only)

substitutions:
  _BUCKET: DriveTracker-app
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DT_FIREBASE_API_KEY/versions/latest
      env: FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/DT_FIREBASE_AUTH_DOMAIN/versions/latest
      env: FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/DT_FIREBASE_PROJECT_ID/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/DT_FIREBASE_STORAGE_BUCKET/versions/latest
      env: FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/DT_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/DT_FIREBASE_APP_ID/versions/latest
      env: FIREBASE_APP_ID
    - versionName: projects/$PROJECT_ID/secrets/DT_ALLOWED_EMAIL/versions/latest
      env: ALLOWED_EMAIL

steps:

  # -- Step 0: Generate config.js from Secret Manager ---------------------------
  - name: 'bash'
    id: 'generate-config'
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_APP_ID
      - ALLOWED_EMAIL
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        printf "// AUTO-GENERATED by Cloud Build — do not commit.\nwindow.DRIVETRACKER_CONFIG = {\n" > config.js
        printf "  FIREBASE_API_KEY:             '%s',\n" "$$FIREBASE_API_KEY" >> config.js
        printf "  FIREBASE_AUTH_DOMAIN:         '%s',\n" "$$FIREBASE_AUTH_DOMAIN" >> config.js
        printf "  FIREBASE_PROJECT_ID:          '%s',\n" "$$FIREBASE_PROJECT_ID" >> config.js
        printf "  FIREBASE_STORAGE_BUCKET:      '%s',\n" "$$FIREBASE_STORAGE_BUCKET" >> config.js
        printf "  FIREBASE_MESSAGING_SENDER_ID: '%s',\n" "$$FIREBASE_MESSAGING_SENDER_ID" >> config.js
        printf "  FIREBASE_APP_ID:              '%s',\n" "$$FIREBASE_APP_ID" >> config.js
        printf "  ALLOWED_EMAIL:                '%s',\n" "$$ALLOWED_EMAIL" >> config.js
        printf "};\n" >> config.js
        echo "config.js generated from Secret Manager"

  # -- Step 1: Validate required source files exist -----------------------------
  - name: 'bash'
    id: 'validate'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== DriveTracker build validation ==="
        for f in index.html app.js styles.css sw.js manifest.json; do
          if [ ! -f "$$f" ]; then
            echo "ERROR: Missing required file: $$f"
            exit 1
          fi
          echo "  OK $$f"
        done
        echo "All required files present."

  # -- Step 2: Deploy versioned assets (CSS, icons, manifest, etc.) -------------
  # These files use query-string versioning (?v=N) so CDN caching is safe.
  # Critical files (index.html, app.js, app2.js, sw.js, config.js) are excluded
  # from rsync and uploaded atomically with no-cache headers in subsequent steps.
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-assets'
    waitFor: ['validate']
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - '-x'
      - 'sw\.js|app2?\.js|index\.html|config\.js|\.git|\.env|\.claude|DEPLOY\.md|CHANGELOG\.md|README\.md|ROADMAP\.md|cloudbuild\.yaml|generate-config\.ps1|firebase\.json|\.firebaserc|deploy\.sh|ui-theme/|graphify-out/'
      - '-h'
      - 'Cache-Control:public, max-age=3600, must-revalidate'
      - '.'
      - 'gs://${_BUCKET}/'

  # ui-theme/theme.css is referenced by the SW shell — deploy it explicitly
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-theme'
    waitFor: ['validate']
    args:
      - 'cp'
      - '-h'
      - 'Cache-Control:public, max-age=3600, must-revalidate'
      - 'ui-theme/theme.css'
      - 'gs://${_BUCKET}/ui-theme/theme.css'

  # -- Step 3: Deploy critical no-cache files atomically ------------------------
  # Each file gets its Cache-Control header in the same upload command so there
  # is no race window where the CDN can cache content without the no-cache header.

  # index.html: network entry point — must never be CDN-cached
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-index'
    waitFor: ['validate']
    args:
      - 'cp'
      - '-h'
      - 'Cache-Control:no-cache, no-store, must-revalidate'
      - 'index.html'
      - 'gs://${_BUCKET}/index.html'

  # app2.js: primary JS entry point referenced by index.html
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-app2'
    waitFor: ['validate']
    args:
      - 'cp'
      - '-h'
      - 'Cache-Control:no-cache, no-store, must-revalidate'
      - 'app.js'
      - 'gs://${_BUCKET}/app2.js'

  # app.js: kept current so stale CDN-cached index.html (referencing /app.js?v=N)
  # still loads the latest code rather than breaking with old behavior
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-appjs'
    waitFor: ['validate']
    args:
      - 'cp'
      - '-h'
      - 'Cache-Control:no-cache, no-store, must-revalidate'
      - 'app.js'
      - 'gs://${_BUCKET}/app.js'

  # sw.js: service worker must be no-cache so browsers detect updates immediately
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-sw'
    waitFor: ['validate']
    args:
      - 'cp'
      - '-h'
      - 'Cache-Control:no-cache, no-store, must-revalidate'
      - 'sw.js'
      - 'gs://${_BUCKET}/sw.js'

  # config.js: contains injected secrets — must never be SW-cached or CDN-cached
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'deploy-config'
    waitFor: ['generate-config']
    args:
      - 'cp'
      - '-h'
      - 'Cache-Control:no-cache, no-store, must-revalidate'
      - 'config.js'
      - 'gs://${_BUCKET}/config.js'

  # -- Step 4: Set bucket-level website config ----------------------------------
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'set-website-config'
    waitFor: ['deploy-assets', 'deploy-index', 'deploy-app2', 'deploy-appjs', 'deploy-sw', 'deploy-config', 'deploy-theme']
    args:
      - 'web'
      - 'set'
      - '-m'
      - 'index.html'
      - '-e'
      - '404.html'
      - 'gs://${_BUCKET}'

  # -- Step 5: Make all objects publicly readable -------------------------------
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'set-public-acl'
    waitFor: ['set-website-config']
    args:
      - 'iam'
      - 'ch'
      - 'allUsers:objectViewer'
      - 'gs://${_BUCKET}'

  # -- Step 6: Smoke test -------------------------------------------------------
  - name: 'gcr.io/cloud-builders/curl'
    id: 'smoke-test'
    waitFor: ['set-public-acl']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Smoke-testing deployment ==="
        for path in index.html app2.js sw.js; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://storage.googleapis.com/${_BUCKET}/$$path")
          if [ "$$STATUS" != "200" ]; then
            echo "ERROR: $$path returned HTTP $$STATUS"
            exit 1
          fi
          echo "  OK $$path (200)"
        done
        # Verify app2.js is referenced in index.html
        if ! curl -s "https://storage.googleapis.com/${_BUCKET}/index.html" | grep -q 'app2\.js'; then
          echo "ERROR: index.html does not reference app2.js"
          exit 1
        fi
        echo "  OK index.html references app2.js"
        SW_CACHE=$(curl -sI "https://storage.googleapis.com/${_BUCKET}/sw.js" \
          | grep -i cache-control)
        echo "  sw.js Cache-Control: $$SW_CACHE"
        echo "Deployment verified."

timeout: '600s'
